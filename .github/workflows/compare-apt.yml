name: Compare dependencies with apt

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-24.04

    steps:
      - name: Check Ubuntu environment
        run: |
          cat /etc/os-release
          dpkg --print-architecture

      - name: Compare bash, grep and sed dependencies
        run: |
          sudo apt-get update -qq

          for package in bash grep sed; do
            echo "===== Package: $package ====="
            apt-cache policy "$package"
            apt-cache depends "$package"
          done
